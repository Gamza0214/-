<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단어 테스트 모델</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 500px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            color: #86868b;
            margin-bottom: 20px;
        }
        .title-sub {
            text-align: center;
            color: #6e6e73;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .word {
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 30px;
            color: #1d1d1f;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            padding: 16px;
            border: 1px solid #e5e5ea;
            border-radius: 12px;
            background: white;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            color: #1d1d1f;
        }
        .btn:hover:not(:disabled) {
            background-color: #f5f5f7;
            border-color: #0071e3;
        }
        .btn.correct {
            background-color: #0071e3 !important;
            color: white !important;
            border-color: #0071e3 !important;
            font-weight: 600;
        }
        .btn.wrong {
            background-color: #ff3b30 !important;
            color: white !important;
            border-color: #ff3b30 !important;
            font-weight: 600;
        }
        .result-msg {
            text-align: center;
            font-weight: 700;
            font-size: 18px;
            margin-top: 20px;
            height: 24px;
        }
        .result-msg.correct-text { color: #0071e3; }
        .result-msg.wrong-text { color: #ff3b30; }
        .next-btn {
            margin-top: 20px;
            width: 100%;
            padding: 14px;
            background-color: #1d1d1f;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: none;
        }
        .next-btn:hover { background-color: #333336; }
        .score-board {
            text-align: center;
            padding: 20px;
        }
        .score-board h2 { font-size: 24px; margin-bottom: 10px; }
        .score-board p { font-size: 18px; color: #6e6e73; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="card" id="quiz-card">
    <div class="header">
        <span>한글 뜻 맞히기</span>
        <span id="progress">1/120</span>
    </div>
    <div class="title-sub">아래 4개의 보기 중에 알맞은 뜻을 고르세요.</div>
    <div class="word" id="target-word">Word</div>
    <div class="options" id="options-container"></div>
    <div class="result-msg" id="result-message"></div>
    <button class="next-btn" id="next-btn" onclick="nextQuestion()">다음 문제로</button>
</div>

    { eng: "neutral", kor: "중립적인" },
    { eng: "obligation", kor: "의무" },
    { eng: "compatible", kor: "양립하는" },
    { eng: "basically", kor: "본질적으로" }
];

let questions = [];
let currentIndex = 0;
let score = 0;

function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
}

function initQuiz() {
    questions = shuffle([...vocabulary]);
    currentIndex = 0;
    score = 0;
    showQuestion();
}

function showQuestion() {
    const q = questions[currentIndex];
    document.getElementById("progress").innerText = `${currentIndex + 1}/${questions.length}`;
    document.getElementById("target-word").innerText = q.eng;
    document.getElementById("result-message").innerText = "";
    document.getElementById("result-message").className = "result-msg";
    document.getElementById("next-btn").style.display = "none";

    let options = [q.kor];
    while (options.length < 4) {
        const randomItem = vocabulary[Math.floor(Math.random() * vocabulary.length)].kor;
        if (!options.includes(randomItem)) {
            options.push(randomItem);
        }
    }
    options = shuffle(options);

    const optionsContainer = document.getElementById("options-container");
    optionsContainer.innerHTML = "";

    options.forEach(option => {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.innerText = option;
        btn.onclick = () => checkAnswer(btn, option, q.kor);
        optionsContainer.appendChild(btn);
    });
}

function checkAnswer(selectedBtn, selectedOption, correctOption) {
    const buttons = document.querySelectorAll(".btn");
    buttons.forEach(btn => btn.disabled = true);

    const resultMsg = document.getElementById("result-message");

    if (selectedOption === correctOption) {
        selectedBtn.classList.add("correct");
        resultMsg.innerText = "⭕ 정답";
        resultMsg.classList.add("correct-text");
        score++;
    } else {
        selectedBtn.classList.add("wrong");
        resultMsg.innerText = "❌ 오답";
        resultMsg.classList.add("wrong-text");
       
        buttons.forEach(btn => {
            if (btn.innerText === correctOption) {
                btn.classList.add("correct");
            }
        });
    }

    document.getElementById("next-btn").style.display = "block";
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex < questions.length) {
        showQuestion();
    } else {
        showScore();
    }
}

function showScore() {
    const card = document.getElementById("quiz-card");
    card.innerHTML = `
        <div class="score-board">
            <h2>테스트 완료!</h2>
            <p>총 <strong>${questions.length}</strong>문제 중 <strong>${score}</strong>문제를 맞혔습니다.</p>
            <button class="next-btn" style="display:block;" onclick="location.reload()">다시 풀기</button>
        </div>
    `;
}

initQuiz();
</script>

</html>
